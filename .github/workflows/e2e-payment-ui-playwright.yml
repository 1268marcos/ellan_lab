# P3 — Playwright: smoke no /checkout (sem backend). Teste DEV completo fica skipped sem E2E_PUBLIC_AUTH_TOKEN.
name: E2E payment UI (Playwright P3)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "01_source/frontend/e2e/**"
      - "01_source/frontend/playwright.config.ts"
      - "01_source/frontend/package.json"
      - "01_source/frontend/package-lock.json"
      - "01_source/frontend/.npmrc"
      - "01_source/frontend/src/pages/public/PublicCheckoutPage.jsx"
      - ".github/workflows/e2e-payment-ui-playwright.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "01_source/frontend/e2e/**"
      - "01_source/frontend/playwright.config.ts"
      - "01_source/frontend/package.json"
      - "01_source/frontend/package-lock.json"
      - "01_source/frontend/.npmrc"
      - "01_source/frontend/src/pages/public/PublicCheckoutPage.jsx"
      - ".github/workflows/e2e-payment-ui-playwright.yml"

jobs:
  playwright-checkout:
    name: Playwright checkout smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: 01_source/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: 01_source/frontend/package-lock.json

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run Playwright
        run: npx playwright test
        env:
          CI: "true"
          PLAYWRIGHT_START_VITE: "1"
          FRONTEND_BASE_URL: http://127.0.0.1:5173
