# ============================================================================
# docker-compose.yml (Compose V2 - VERSÃO CORRIGIDA)
# 19/05/2026
# ============================================================================
# 
# MUDANÇAS:
# ✓ Usa postgis/postgis:15-3.4 oficial (em vez de build custom)
# ✓ Remove referência a postgresql.conf (que causa issues)
# ✓ Healthcheck mais tolerante
# ✓ Volume de dados limpo para evitar collation mismatch
#
# ============================================================================

networks:
  locker-network:
    name: locker_network
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1

volumes:
  grafana_data:
    name: grafana_data

services:

  # =========================
  # POSTGRES CENTRAL (CORRIGIDO COM TIMESCALEDB)
  # =========================
  postgres_central:
    build:
      context: .
      dockerfile: Dockerfile.postgres  # ← Usar seu Dockerfile
    container_name: postgres_central
    restart: unless-stopped
    environment:
      POSTGRES_DB: locker_central
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      TZ: UTC
      POSTGRES_HOST_AUTH_METHOD: trust
      
      # PostGIS + TimescaleDB via POSTGRES_INIT_ARGS (se suportado)
      # ou via arquivo init (veja abaixo)

      # TimescaleDB específico
      TIMESCALEDB_TELEMETRY: off  # Desliga telemetria

    ports:
      - "5435:5432"
    volumes:
      - ../03_data/postgres_central:/var/lib/postgresql/data   # ← Dados persistentes
      - ./postgres_central/init:/docker-entrypoint-initdb.d     # ← Scripts de init (timescaledb, etc)
      # ⚠️ NÃO monte postgresql.conf aqui - deixe PostgreSQL usar defaults
      # Se precisar customizar, use POSTGRES_INIT_ARGS ou script SQL
      # Se precisar de configurações custom, use o bloco 'command' abaixo
    # command: >
    #   postgres
    #   -c shared_preload_libraries='timescaledb,pg_cron'
    #   -c pg_cron.database_name='locker_central'
    #   -c shared_buffers=256MB
    #   -c effective_cache_size=1GB
    #   -c work_mem=4MB
    #   -c maintenance_work_mem=64MB
    #   -c wal_level=replica
    #   -c max_wal_senders=10
    #   -c wal_keep_size=512MB
    #   -c effective_io_concurrency=200
    #   -c random_page_cost=1.1
    #   -c log_statement=ddl
    #   -c log_min_duration_statement=1000
    #   -c timezone=UTC

    healthcheck:
      # -h 127.0.0.1: sem host, pg_isready usa cluster Debian "15 main" (data dir inválido no Docker)
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U admin -d locker_central"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - locker-network

  # =========================
  # REDIS CENTRAL
  # =========================
  redis_central:
    image: redis:7
    container_name: redis_central
    restart: unless-stopped
    ports:
      - "6382:6379"
    volumes:
      - ../03_data/redis_central:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - locker-network

  # =========================
  # MQTT BROKER
  # =========================
  mqtt:
    image: eclipse-mosquitto:2
    container_name: mqtt_broker
    restart: unless-stopped
    ports:
      - "1884:1883"
    volumes:
      - ../03_data/mqtt:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-W", "5"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - locker-network

  # =========================
  # BACKEND RUNTIME
  # =========================
  backend_runtime:
    build:
      context: ../01_source/backend/runtime
      dockerfile: Dockerfile
    container_name: backend_runtime
    restart: unless-stopped
    ports:
      - "8200:8000"
    environment:
      DB_HOST: postgres_central
      DB_NAME: locker_central
      DB_USER: admin
      DB_PASS: admin123
      REDIS_HOST: redis_central
      APP_NAME: backend_runtime
      HOST: 0.0.0.0
      PORT: 8000
      INTERNAL_TOKEN: ${ORDER_INTERNAL_TOKEN}
      MQTT_HOST: mqtt_broker
      MQTT_PORT: 1883
      BACKUPS_DIR: /backups
      LOGS_DIR: /logs
      CENTRAL_POSTGRES_DSN: postgresql://admin:admin123@postgres_central:5432/locker_central
      EVENTS_DB_PATH: /data/sqlite/runtime/events.db
      LOG_HASH_SALT: ${LOG_HASH_SALT}
      RUNTIME_REGISTRY_CACHE_TTL_SEC: 5
      RUNTIME_APPLY_SCHEMA_ON_STARTUP: "true"
      RUNTIME_SYNC_ON_STARTUP: "true"
      RUNTIME_SYNC_PRUNE_MISSING_ON_STARTUP: "false"
      RUNTIME_FAIL_FAST_ON_STARTUP_ERROR: "true"
      TZ: UTC
    volumes:
      - ../03_data/sqlite:/data/sqlite
      - ../04_logs:/logs
      - ../05_backups:/backups
    depends_on:
      postgres_central:
        condition: service_healthy
      redis_central:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    networks:
      - locker-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =========================
  # PAYMENT GATEWAY
  # =========================
  payment_gateway:
    build:
      context: ../01_source/payment_gateway
      dockerfile: Dockerfile
    container_name: payment_gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis_central
      - GATEWAY_REDIS_HOST=redis_central
      - MQTT_HOST=mqtt_broker
      - TZ=UTC
      - GATEWAY_SQLITE_PATH=/data/sqlite/gateway/events.db
      - CENTRAL_POSTGRES_DSN=postgresql://admin:admin123@postgres_central:5432/locker_central
      - LOCKER_REGISTRY_JSON=${LOCKER_REGISTRY_JSON:-}
      - DEFAULT_LOCKER_ID=${DEFAULT_LOCKER_ID:-}
      - LOCKER_ID_SP=${LOCKER_ID_SP:-}
      - LOCKER_ID_PT=${LOCKER_ID_PT:-}
      - ANTIFRAUD_ACTIVE_PEPPER_VERSION=${ANTIFRAUD_ACTIVE_PEPPER_VERSION}
      - ANTIFRAUD_PEPPER_V1=${ANTIFRAUD_PEPPER_V1}
      - ANTIFRAUD_PEPPER_V2=${ANTIFRAUD_PEPPER_V2}
      - IDEMPOTENCY_TTL_SEC=86400
      - DEVICE_FP_VERSION=v1_web
      - LOG_HASH_SALT=${LOG_HASH_SALT}
      - ANTIFRAUD_PEPPER=${ANTIFRAUD_PEPPER}
      - MERCADOPAGO_ACCESS_TOKEN=${MERCADOPAGO_ACCESS_TOKEN}
      - STRIPE_SECRET_KEY_PT=${STRIPE_SECRET_KEY_PT}
      - STRIPE_SECRET_KEY_SP=${STRIPE_SECRET_KEY_SP}
      - LOG_DIR=/logs
      - LOCKER_RUNTIME_INTERNAL=http://backend_runtime:8000
      - RUNTIME_BASE_URL=http://backend_runtime:8000
      - BACKEND_SP=http://backend_runtime:8000
      - BACKEND_PT=http://backend_runtime:8000
      - LOCKER_RUNTIME_HEALTH_PATH=/health
      - LOCKER_RUNTIME_ALLOCATE_PATH=/locker/allocate
      - LOCKER_RUNTIME_COMMIT_PATH=/locker/allocations/{allocation_id}/commit
      - LOCKER_RUNTIME_RELEASE_PATH=/locker/allocations/{allocation_id}/release
      - LOCKER_RUNTIME_SLOTS_PATH=/locker/slots
      - LOCKER_RUNTIME_SLOT_PATH=/locker/slots/{slot}
      - LOCKER_RUNTIME_SET_SLOT_STATE_PATH=/locker/slots/{slot}/set-state
      - LOCKER_RUNTIME_OPEN_SLOT_PATH=/locker/slots/{slot}/open
      - LOCKER_RUNTIME_LIGHT_ON_PATH=/locker/slots/{slot}/light/on
      - LOCKER_RUNTIME_CATALOG_SKUS_PATH=/catalog/skus
      - LOCKER_RUNTIME_CATALOG_SKU_PATH=/catalog/skus/{sku_id}
      - LOCKER_RUNTIME_CATALOG_SLOTS_PATH=/catalog/slots
      - INTERNAL_SERVICE_TOKEN=${ORDER_INTERNAL_TOKEN}
      - GATEWAY_E2E_RELAX_RISK=${GATEWAY_E2E_RELAX_RISK:-true}
    volumes:
      - ../03_data/sqlite:/data/sqlite
      - ../04_logs:/logs
      - ../05_backups:/backups
    depends_on:
      postgres_central:
        condition: service_healthy
      redis_central:
        condition: service_healthy
      mqtt:
        condition: service_healthy
      backend_runtime:
        condition: service_healthy
    networks:
      - locker-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 90s

  # =========================
  # ORDER PICKUP SERVICE
  # =========================
  order_pickup_service:
    build:
      context: ../01_source/order_pickup_service
    container_name: order_pickup_service
    restart: unless-stopped
    ports:
      - "8003:8003"
    env_file:
      - ../01_source/order_pickup_service/.env
    environment:
      - TZ=UTC
      - BACKEND_PRICE_PATH_TEMPLATE=/catalog/skus/{sku_id}
      - PAYMENT_GATEWAY_INTERNAL=http://payment_gateway:8000
      - PAYMENT_GATEWAY_LOCKERS_PATH_TEMPLATE=/lockers/{locker_id}
      - BILLING_FISCAL_SERVICE_URL=http://billing_fiscal_service:8020
      - BILLING_FISCAL_TIMEOUT_SEC=5
      - INTERNAL_TOKEN=${ORDER_INTERNAL_TOKEN}
      - PICKUP_QR_SECRET=${PICKUP_QR_SECRET}
      - QR_ROTATE_SEC=${QR_ROTATE_SEC}
      - DATABASE_URL=postgresql+psycopg2://admin:admin123@postgres_central:5432/locker_central
      - RUN_DB_MIGRATIONS_ON_STARTUP=true
      - BACKEND_CLIENT_TIMEOUT_SEC=5
      - CENTRAL_POSTGRES_DSN=postgresql://admin:admin123@postgres_central:5432/locker_central
      - NODE_ENV=${NODE_ENV:-development}
      - EXPIRY_POLL_SEC=60
      - LIFECYCLE_EVENTS_POLL_SEC=10
      - FRONTEND_BASE_URL=http://localhost:5173
    depends_on:
      postgres_central:
        condition: service_healthy
      payment_gateway:
        condition: service_healthy
      backend_runtime:
        condition: service_healthy
      order_lifecycle_service:
        condition: service_started
    volumes:
      - ../04_logs:/app/ops_logs
    networks:
      - locker-network

  # =========================
  # PARTNER SERVICE
  # =========================
  partner_service:
    image: python:3.12-slim
    container_name: partner_service
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             python -m uvicorn app.main:app --host 0.0.0.0 --port 8002"
    ports:
      - "8402:8002"
    environment:
      - TZ=UTC
      - REDIS_URL=redis://redis_central:6379/0
    volumes:
      - ../01_source/partner_service:/app
    depends_on:
      redis_central:
        condition: service_healthy
    networks:
      - locker-network

  # =========================
  # ORDER LIFECYCLE SERVICE
  # =========================
  order_lifecycle_service:
    build:
      context: ../01_source/backend/order_lifecycle_service
    container_name: order_lifecycle_service
    environment:
      SERVICE_NAME: order_lifecycle_service
      APP_ENV: dev
      LOG_LEVEL: INFO
      HOST: 0.0.0.0
      PORT: 8010
      INTERNAL_TOKEN: ${ORDER_INTERNAL_TOKEN}
      INTERNAL_SERVICE_TOKEN: ${ORDER_INTERNAL_TOKEN}
      LOCKER_RUNTIME_INTERNAL: http://backend_runtime:8000
      POSTGRES_HOST: postgres_central
      POSTGRES_PORT: 5432
      POSTGRES_DB: locker_central
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      PREPAYMENT_TIMEOUT_SECONDS: 90
      WORKER_POLL_INTERVAL_SECONDS: 5
      TZ: UTC
    ports:
      - "8010:8010"
    depends_on:
      postgres_central:
        condition: service_healthy
    networks:
      - locker-network

  # =========================
  # ORDER LIFECYCLE WORKER
  # =========================
  order_lifecycle_worker:
    build:
      context: ../01_source/backend/order_lifecycle_service
    container_name: order_lifecycle_worker
    command: ["python", "-m", "app.workers.prepayment_timeout_worker"]
    environment:
      SERVICE_NAME: order_lifecycle_service
      APP_ENV: dev
      LOG_LEVEL: INFO
      INTERNAL_TOKEN: ${ORDER_INTERNAL_TOKEN}
      INTERNAL_SERVICE_TOKEN: ${ORDER_INTERNAL_TOKEN}
      LOCKER_RUNTIME_INTERNAL: http://backend_runtime:8000
      POSTGRES_HOST: postgres_central
      POSTGRES_PORT: 5432
      POSTGRES_DB: locker_central
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      PREPAYMENT_TIMEOUT_SECONDS: 90
      WORKER_POLL_INTERVAL_SECONDS: 5
      TZ: UTC
    depends_on:
      postgres_central:
        condition: service_healthy
    networks:
      - locker-network

  # =========================
  # BILLING FISCAL SERVICE
  # =========================
  billing_fiscal_service:
    build:
      context: ../01_source/backend/billing_fiscal_service
    container_name: billing_fiscal_service
    environment:
      SERVICE_NAME: billing_fiscal_service
      APP_ENV: dev
      LOG_LEVEL: INFO
      INTERNAL_TOKEN: ${ORDER_INTERNAL_TOKEN}
      HOST: 0.0.0.0
      PORT: 8020
      POSTGRES_HOST: postgres_central
      POSTGRES_PORT: 5432
      POSTGRES_DB: locker_central
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      ORDER_PICKUP_SERVICE_URL: http://order_pickup_service:8003
      ORDER_PICKUP_TIMEOUT_SEC: 5
      INVOICE_ISSUE_POLL_SEC: 5
      INVOICE_ISSUE_BATCH_SIZE: 50
      INVOICE_ISSUE_MAX_RETRIES: 5
      INVOICE_ISSUE_BASE_BACKOFF_SEC: 15
      INVOICE_ISSUE_PROCESSING_TIMEOUT_SEC: 180
      INVOICE_ISSUE_WORKER_ID: billing_fiscal_issue_worker
      TZ: UTC
      FISCAL_REAL_PROVIDER_BR_ENABLED: "${FISCAL_REAL_PROVIDER_BR_ENABLED:-false}"
      FISCAL_REAL_PROVIDER_PT_ENABLED: "${FISCAL_REAL_PROVIDER_PT_ENABLED:-false}"
      FISCAL_REAL_PROVIDER_BASE_URL_BR: "${FISCAL_REAL_PROVIDER_BASE_URL_BR:-}"
      FISCAL_REAL_PROVIDER_BASE_URL_PT: "${FISCAL_REAL_PROVIDER_BASE_URL_PT:-}"
      FISCAL_REAL_PROVIDER_API_KEY_BR: "${FISCAL_REAL_PROVIDER_API_KEY_BR:-}"
      FISCAL_REAL_PROVIDER_API_KEY_PT: "${FISCAL_REAL_PROVIDER_API_KEY_PT:-}"
      FISCAL_REAL_PROVIDER_TIMEOUT_SEC: "${FISCAL_REAL_PROVIDER_TIMEOUT_SEC:-8}"
      FISCAL_REAL_PROVIDER_RETRIES: "${FISCAL_REAL_PROVIDER_RETRIES:-2}"
      FISCAL_A1_DRY_RUN_ENABLED: "${FISCAL_A1_DRY_RUN_ENABLED:-false}"
      FISCAL_A1_DRY_RUN_CERT_REF: "${FISCAL_A1_DRY_RUN_CERT_REF:-}"
      FISCAL_A1_DRY_RUN_HMAC_SECRET: "${FISCAL_A1_DRY_RUN_HMAC_SECRET:-}"
    ports:
      - "8020:8020"
    depends_on:
      postgres_central:
        condition: service_healthy
      order_pickup_service:
        condition: service_started
    networks:
      - locker-network

  # =========================
  # BILLING FISCAL ISSUE WORKER
  # =========================
  billing_fiscal_issue_worker:
    build:
      context: ../01_source/backend/billing_fiscal_service
    container_name: billing_fiscal_issue_worker
    command: ["python", "-m", "app.workers.invoice_issue_worker"]
    restart: unless-stopped
    environment:
      SERVICE_NAME: billing_fiscal_service
      APP_ENV: dev
      LOG_LEVEL: INFO
      INTERNAL_TOKEN: ${ORDER_INTERNAL_TOKEN}
      HOST: 0.0.0.0
      PORT: 8020
      POSTGRES_HOST: postgres_central
      POSTGRES_PORT: 5432
      POSTGRES_DB: locker_central
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      ORDER_PICKUP_SERVICE_URL: http://order_pickup_service:8003
      ORDER_PICKUP_TIMEOUT_SEC: 5
      INVOICE_ISSUE_POLL_SEC: 5
      INVOICE_ISSUE_BATCH_SIZE: 50
      INVOICE_ISSUE_MAX_RETRIES: 5
      INVOICE_ISSUE_BASE_BACKOFF_SEC: 15
      INVOICE_ISSUE_PROCESSING_TIMEOUT_SEC: 180
      INVOICE_ISSUE_WORKER_ID: billing_fiscal_issue_worker
      TZ: UTC
      FISCAL_REAL_PROVIDER_BR_ENABLED: "${FISCAL_REAL_PROVIDER_BR_ENABLED:-false}"
      FISCAL_REAL_PROVIDER_PT_ENABLED: "${FISCAL_REAL_PROVIDER_PT_ENABLED:-false}"
      FISCAL_REAL_PROVIDER_BASE_URL_BR: "${FISCAL_REAL_PROVIDER_BASE_URL_BR:-}"
      FISCAL_REAL_PROVIDER_BASE_URL_PT: "${FISCAL_REAL_PROVIDER_BASE_URL_PT:-}"
      FISCAL_REAL_PROVIDER_API_KEY_BR: "${FISCAL_REAL_PROVIDER_API_KEY_BR:-}"
      FISCAL_REAL_PROVIDER_API_KEY_PT: "${FISCAL_REAL_PROVIDER_API_KEY_PT:-}"
      FISCAL_REAL_PROVIDER_TIMEOUT_SEC: "${FISCAL_REAL_PROVIDER_TIMEOUT_SEC:-8}"
      FISCAL_REAL_PROVIDER_RETRIES: "${FISCAL_REAL_PROVIDER_RETRIES:-2}"
      FISCAL_A1_DRY_RUN_ENABLED: "${FISCAL_A1_DRY_RUN_ENABLED:-false}"
      FISCAL_A1_DRY_RUN_CERT_REF: "${FISCAL_A1_DRY_RUN_CERT_REF:-}"
      FISCAL_A1_DRY_RUN_HMAC_SECRET: "${FISCAL_A1_DRY_RUN_HMAC_SECRET:-}"
    depends_on:
      postgres_central:
        condition: service_healthy
      billing_fiscal_service:
        condition: service_started
      order_pickup_service:
        condition: service_started
    networks:
      - locker-network

  # =========================
  # BILLING FISCAL EVENT WORKER
  # =========================
  billing_fiscal_event_worker:
    build:
      context: ../01_source/backend/billing_fiscal_service
    container_name: billing_fiscal_event_worker
    command: ["python", "-m", "app.workers.invoice_event_worker"]
    restart: unless-stopped
    environment:
      SERVICE_NAME: billing_fiscal_service
      APP_ENV: dev
      LOG_LEVEL: INFO
      INTERNAL_TOKEN: ${ORDER_INTERNAL_TOKEN}
      POSTGRES_HOST: postgres_central
      POSTGRES_PORT: 5432
      POSTGRES_DB: locker_central
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      ORDER_PICKUP_SERVICE_URL: http://order_pickup_service:8003
      ORDER_PICKUP_TIMEOUT_SEC: 5
      INVOICE_EVENT_WORKER_POLL_SEC: 10
      INVOICE_EVENT_WORKER_BATCH_SIZE: 100
      INVOICE_ISSUE_MAX_RETRIES: 5
      INVOICE_ISSUE_BASE_BACKOFF_SEC: 15
      INVOICE_ISSUE_PROCESSING_TIMEOUT_SEC: 180
      INVOICE_ISSUE_WORKER_ID: billing_fiscal_event_worker
      TZ: UTC
      FISCAL_REAL_PROVIDER_BR_ENABLED: "${FISCAL_REAL_PROVIDER_BR_ENABLED:-false}"
      FISCAL_REAL_PROVIDER_PT_ENABLED: "${FISCAL_REAL_PROVIDER_PT_ENABLED:-false}"
      FISCAL_REAL_PROVIDER_BASE_URL_BR: "${FISCAL_REAL_PROVIDER_BASE_URL_BR:-}"
      FISCAL_REAL_PROVIDER_BASE_URL_PT: "${FISCAL_REAL_PROVIDER_BASE_URL_PT:-}"
      FISCAL_REAL_PROVIDER_API_KEY_BR: "${FISCAL_REAL_PROVIDER_API_KEY_BR:-}"
      FISCAL_REAL_PROVIDER_API_KEY_PT: "${FISCAL_REAL_PROVIDER_API_KEY_PT:-}"
      FISCAL_REAL_PROVIDER_TIMEOUT_SEC: "${FISCAL_REAL_PROVIDER_TIMEOUT_SEC:-8}"
      FISCAL_REAL_PROVIDER_RETRIES: "${FISCAL_REAL_PROVIDER_RETRIES:-2}"
    depends_on:
      postgres_central:
        condition: service_healthy
      billing_fiscal_service:
        condition: service_started
      order_pickup_service:
        condition: service_started
    networks:
      - locker-network

  # =========================
  # ORDER PICKUP DOMAIN EVENT WORKER
  # =========================
  order_pickup_domain_event_worker:
    build:
      context: ../01_source/order_pickup_service
    container_name: order_pickup_domain_event_worker
    command: ["python", "-m", "app.workers.domain_event_outbox_worker"]
    restart: unless-stopped
    env_file:
      - ../01_source/order_pickup_service/.env
    environment:
      - TZ=UTC
      - INTERNAL_TOKEN=${ORDER_INTERNAL_TOKEN}
      - DATABASE_URL=postgresql+psycopg2://admin:admin123@postgres_central:5432/locker_central
      - LIFECYCLE_SERVICE_URL=http://order_lifecycle_service:8010
      - DOMAIN_EVENT_OUTBOX_POLL_SEC=5
      - DOMAIN_EVENT_OUTBOX_BATCH_SIZE=50
    depends_on:
      postgres_central:
        condition: service_healthy
      order_lifecycle_service:
        condition: service_started
      order_pickup_service:
        condition: service_started
    networks:
      - locker-network

  # =========================
  # PARTNER WEBHOOK DELIVERY WORKER
  # =========================
  partner_webhook_delivery_worker:
    build:
      context: ../01_source/order_pickup_service
    container_name: partner_webhook_delivery_worker
    command: ["python", "-m", "app.workers.partner_webhook_delivery_worker"]
    restart: unless-stopped
    env_file:
      - ../01_source/order_pickup_service/.env
    environment:
      - TZ=UTC
      - DATABASE_URL=postgresql+psycopg2://admin:admin123@postgres_central:5432/locker_central
      - RUN_DB_MIGRATIONS_ON_STARTUP=true
      - PARTNER_WEBHOOK_DELIVERY_POLL_SEC=5
      - PARTNER_WEBHOOK_DELIVERY_BATCH_SIZE=50
      - PARTNER_WEBHOOK_MAX_ATTEMPTS=5
      - PARTNER_WEBHOOK_PROCESSING_STALE_TIMEOUT_SEC=180
      - PARTNER_WEBHOOK_HTTP_TIMEOUT_SEC=8
    depends_on:
      postgres_central:
        condition: service_healthy
      order_pickup_service:
        condition: service_started
    networks:
      - locker-network

  # =========================
  # PARTNER INTEGRATION HEALTH WORKER
  # =========================
  partner_integration_health_worker:
    build:
      context: ../01_source/order_pickup_service
    container_name: partner_integration_health_worker
    command: ["python", "-m", "app.workers.partner_integration_health_worker"]
    restart: unless-stopped
    env_file:
      - ../01_source/order_pickup_service/.env
    environment:
      - TZ=UTC
      - DATABASE_URL=postgresql+psycopg2://admin:admin123@postgres_central:5432/locker_central
      - RUN_DB_MIGRATIONS_ON_STARTUP=true
      - PARTNER_INTEGRATION_HEALTH_POLL_SEC=300
      - PARTNER_INTEGRATION_HEALTH_TIMEOUT_SEC=8
      - PARTNER_INTEGRATION_HEALTH_BATCH_SIZE=500
    depends_on:
      postgres_central:
        condition: service_healthy
      order_pickup_service:
        condition: service_started
    networks:
      - locker-network

  # =========================
  # NOTIFICATION SERVICE
  # =========================
  notification_service:
    build:
      context: ../01_source/notification_service
      dockerfile: Dockerfile
    container_name: notification_service
    restart: unless-stopped
    ports:
      - "8011:8011"
    environment:
      - TZ=UTC
      - DATABASE_URL=postgresql+psycopg2://admin:admin123@postgres_central:5432/locker_central
      - REDIS_URL=redis://redis_central:6379/2
      - RATE_LIMIT_PER_HOUR=10
      - MAX_RETRIES=3
    depends_on:
      postgres_central:
        condition: service_healthy
      redis_central:
        condition: service_healthy
    networks:
      - locker-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =========================
  # NOTIFICATION DELIVERY WORKER
  # =========================
  notification_delivery_worker:
    build:
      context: ../01_source/notification_service
      dockerfile: Dockerfile
    container_name: notification_delivery_worker
    command: ["python", "-m", "app.workers.delivery_runner"]
    restart: unless-stopped
    environment:
      - TZ=UTC
      - DATABASE_URL=postgresql+psycopg2://admin:admin123@postgres_central:5432/locker_central
      - REDIS_URL=redis://redis_central:6379/2
      - NOTIFICATION_DELIVERY_POLL_SEC=1
      - RATE_LIMIT_PER_HOUR=10
      - MAX_RETRIES=3
    depends_on:
      postgres_central:
        condition: service_healthy
      redis_central:
        condition: service_healthy
      notification_service:
        condition: service_started
    networks:
      - locker-network

  # =========================
  # ORDER LIFECYCLE PICKUP TIMEOUT WORKER
  # =========================
  order_lifecycle_pickup_worker:
    build:
      context: ../01_source/backend/order_lifecycle_service
    container_name: order_lifecycle_pickup_worker
    command: ["python", "-m", "app.workers.pickup_timeout_worker"]
    restart: unless-stopped
    environment:
      SERVICE_NAME: order_lifecycle_service
      APP_ENV: dev
      LOG_LEVEL: INFO
      INTERNAL_TOKEN: ${ORDER_INTERNAL_TOKEN}
      INTERNAL_SERVICE_TOKEN: ${ORDER_INTERNAL_TOKEN}
      LOCKER_RUNTIME_INTERNAL: http://backend_runtime:8000
      POSTGRES_HOST: postgres_central
      POSTGRES_PORT: 5432
      POSTGRES_DB: locker_central
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      PREPAYMENT_TIMEOUT_SECONDS: 90
      WORKER_POLL_INTERVAL_SECONDS: 5
      TZ: UTC
    depends_on:
      postgres_central:
        condition: service_healthy
      order_lifecycle_service:
        condition: service_started
    networks:
      - locker-network

  # =========================
  # SIMULATOR BACKEND RUNTIME
  # =========================
  simulator_backend_runtime:
    build:
      context: ../01_source/simulator
    container_name: simulator_backend_runtime
    restart: unless-stopped
    environment:
      MQTT_HOST: mqtt_broker
      MQTT_PORT: "1883"
      REGION: PT
      LOCKER_ID: ${DEFAULT_LOCKER_ID:-}
      LOCKER_ID_SP: ${LOCKER_ID_SP:-}
      LOCKER_ID_PT: ${LOCKER_ID_PT:-}
      MACHINE_ID: CACIFO-PT-001
      MACHINE_ID_SP: CACIFO-SP-001
      MACHINE_ID_PT: CACIFO-PT-001
      FAILURE_RATE: "0.09"
      PAYMENT_TRIGGERS_OPEN: "false"
      TZ: UTC
      DEBUG_LOGS: "true"
    depends_on:
      mqtt:
        condition: service_healthy
    networks:
      - locker-network

  # =========================
  # GRAFANA
  # =========================
  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "8300:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:8300
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      postgres_central:
        condition: service_healthy
    networks:
      - locker-network

  # =========================
  # METABASE
  # =========================
  metabase:
    image: metabase/metabase:v0.53.6
    container_name: metabase
    restart: unless-stopped
    ports:
      - "8301:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres_central
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase_app
      MB_DB_USER: admin
      MB_DB_PASS: admin123
      MB_SITE_URL: http://localhost:8301
      JAVA_TIMEZONE: UTC
      MB_PLUGINS_DIR: /dev/null
    volumes:
      - ../03_data/metabase:/metabase-data
    depends_on:
      postgres_central:
        condition: service_healthy
    networks:
      - locker-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # =========================
  # ML PREDICTOR SERVICE
  # =========================
  ml_predictor_service:
    build:
      context: ../01_source/backend/ml_predictor_service
      dockerfile: Dockerfile
    container_name: ml_predictor_service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - TZ=UTC
      - DATABASE_URL=postgresql://admin:admin123@postgres_central:5432/locker_central
      - ML_DATABASE_URL=postgresql://admin:admin123@postgres_central:5432/locker_central
      - MODEL_ARTIFACT_PATH=/app/artifacts/rf_failure.joblib
      - ML_MODEL_DIR=/app/artifacts
      - ENABLE_TRAIN_SCHEDULER=false
      - ENABLE_BATCH_PREDICT_SCHEDULER=false
      - SCHEDULER_HOUR=2
      - SCHEDULER_TIMEZONE=America/Sao_Paulo
      - BATCH_PREDICT_HOUR=2
      - BATCH_PREDICT_MINUTE=30
      - PREDICT_COMMIT_BATCH_SIZE=100
      - CHURN_MODEL_PATH=/app/artifacts/churn_model.pkl
      - PRICING_BANDIT_STATE_PATH=/app/artifacts/pricing_bandit_state.pkl
      - LSTM_OCCUPANCY_MODEL_PATH=/app/artifacts/lstm_occupancy.keras
      - LSTM_OCCUPANCY_SCALERS_PATH=/app/artifacts/lstm_occupancy_scalers.joblib
      - LSTM_OCCUPANCY_META_PATH=/app/artifacts/lstm_occupancy.meta.json
      - FRAUD_MODEL_DIR=/app/artifacts/fraud
      - FRAUD_MODEL_BUNDLE_PATH=/app/artifacts/fraud/fraud_bundle.joblib
      - FRAUD_MODEL_META_PATH=/app/artifacts/fraud/fraud_bundle.meta.json
      - ROUTING_TRAVEL_RF_PATH=/app/artifacts/routing_travel_rf.joblib
      - FEEDBACK_USE_TFIDF_ONLY=true
    volumes:
      - ../03_data/artifacts:/app/artifacts
      - ../04_logs/ml_predictor:/app/logs
    depends_on:
      postgres_central:
        condition: service_healthy
    networks:
      - locker-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
