# Nginx example: serve current frontend under /v1/ and redirect / -> /v1/
#
# Usage inside server { }:
#   include /absolute/path/02_docker/nginx/frontend-v1-spa.example.conf;
#
# Expected build artifacts:
#   root /var/www/frontend;   # where dist/ is copied

location = / {
    return 302 /v1/;
}

location /v1/ {
    try_files $uri $uri/ /v1/index.html;
}
