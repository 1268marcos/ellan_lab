# ELLAN Lab — exemplo ativável de Content-Security-Policy no Nginx
#
# Fonte canónica do valor: 01_source/frontend/ellan-frontend-csp.mjs (export ELLAN_FRONTEND_CSP).
# Após alterar a política no .mjs, copiar o literal para o map abaixo OU gerar header noutro proxy a partir do mesmo ficheiro.
#
# Inclusão sugerida no server { } que serve o dist do Vite:
#   include /caminho/absoluto/02_docker/nginx/csp-frontend.example.conf;
#
# Em produção: substituir connect-src (remover localhost/ws dev; APIs + WSS reais) e, em server HTTPS, acrescentar upgrade-insecure-requests ao literal.

map $http_host $ellan_frontend_csp {
    default "default-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; img-src 'self' data: https:; font-src 'self' data: https:; media-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; script-src-attr 'none'; worker-src 'self' blob:; manifest-src 'self'; navigate-to 'self'; connect-src 'self' http://127.0.0.1:8000 http://127.0.0.1:8003 http://127.0.0.1:8010 http://127.0.0.1:8020 http://127.0.0.1:8200 http://127.0.0.1:8201 http://127.0.0.1:8202 http://localhost:8000 http://localhost:8003 http://localhost:8010 http://localhost:8020 http://localhost:8200 http://localhost:8201 http://localhost:8202 ws://127.0.0.1:5173 ws://127.0.0.1:5174 ws://127.0.0.1:4173 ws://localhost:5173 ws://localhost:5174 ws://localhost:4173 https://api.github.com https://github.com";
}

# Produção HTTPS (exemplo): segundo add_header com política endurecida — copiar literal de ellan-frontend-csp.mjs, trocar connect-src e acrescentar upgrade-insecure-requests antes do último ';'
# add_header Content-Security-Policy "default-src 'self'; ...; connect-src 'self' https://api.exemplo.com wss://api.exemplo.com; upgrade-insecure-requests;" always;

# No bloco server { }:
# add_header Content-Security-Policy $ellan_frontend_csp always;
