# ELLAN Lab — exemplo ativável de Content-Security-Policy no Nginx
#
# Fonte canónica: 01_source/frontend/ellan-frontend-csp.mjs
#   - ELLAN_FRONTEND_CSP → map $ellan_frontend_csp (compat, ~85%: style-src inclui 'unsafe-inline')
#   - ELLAN_FRONTEND_CSP_STRICT_STYLE (~95%: style-src só 'self')
# Após alterar o .mjs, atualizar os literais abaixo ou gerar o header a partir do mesmo ficheiro.
#
# Inclusão sugerida no server { } que serve o dist do Vite:
#   include /caminho/absoluto/02_docker/nginx/csp-frontend.example.conf;
#
# Em produção: substituir connect-src (remover localhost/ws dev; APIs + WSS reais) e, em server HTTPS, acrescentar upgrade-insecure-requests ao literal.

map $http_host $ellan_frontend_csp {
    default "default-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; img-src 'self' data: https:; font-src 'self' data: https:; media-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; script-src-attr 'none'; worker-src 'self' blob:; manifest-src 'self'; connect-src 'self' http://127.0.0.1:8000 http://127.0.0.1:8003 http://127.0.0.1:8010 http://127.0.0.1:8020 http://127.0.0.1:8200 http://127.0.0.1:8201 http://127.0.0.1:8202 http://127.0.0.1:8047 http://localhost:8000 http://localhost:8003 http://localhost:8010 http://localhost:8020 http://localhost:8200 http://localhost:8201 http://localhost:8202 http://localhost:8047 ws://127.0.0.1:5173 ws://127.0.0.1:5174 ws://127.0.0.1:4173 ws://localhost:5173 ws://localhost:5174 ws://localhost:4173 https://api.github.com https://github.com";
}

# Staging / pós-migração estilos: alinhar com export ELLAN_FRONTEND_CSP_STRICT_STYLE
map $http_host $ellan_frontend_csp_strict_style {
    default "default-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; img-src 'self' data: https:; font-src 'self' data: https:; media-src 'self' data: https:; style-src 'self'; script-src 'self'; script-src-attr 'none'; worker-src 'self' blob:; manifest-src 'self'; connect-src 'self' http://127.0.0.1:8000 http://127.0.0.1:8003 http://127.0.0.1:8010 http://127.0.0.1:8020 http://127.0.0.1:8200 http://127.0.0.1:8201 http://127.0.0.1:8202 http://127.0.0.1:8047 http://localhost:8000 http://localhost:8003 http://localhost:8010 http://localhost:8020 http://localhost:8200 http://localhost:8201 http://localhost:8202 http://localhost:8047 ws://127.0.0.1:5173 ws://127.0.0.1:5174 ws://127.0.0.1:4173 ws://localhost:5173 ws://localhost:5174 ws://localhost:4173 https://api.github.com https://github.com";
}

# Escolher no server { }:
#   add_header Content-Security-Policy $ellan_frontend_csp always;
# Staging (~95%, sem unsafe-inline em style):
#   add_header Content-Security-Policy $ellan_frontend_csp_strict_style always;

# Produção HTTPS (exemplo): copiar literal de ellan-frontend-csp.mjs, trocar connect-src e acrescentar upgrade-insecure-requests antes do último ';'
# add_header Content-Security-Policy "default-src 'self'; ...; connect-src 'self' https://api.exemplo.com wss://api.exemplo.com; upgrade-insecure-requests;" always;
