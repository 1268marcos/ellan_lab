# Nginx example: serve frontend_v0 under /v0/ and redirect / -> /v0/
#
# Usage inside server { }:
#   include /absolute/path/02_docker/nginx/frontend-v0-spa.example.conf;
#
# Expected build artifacts:
#   root /var/www/frontend_v0;   # where dist/ is copied

location = / {
    return 302 /v0/;
}

location /v0/ {
    try_files $uri $uri/ /v0/index.html;
}
