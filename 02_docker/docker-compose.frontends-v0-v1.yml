services:
  nginx_frontends_v0_v1:
    image: nginx:1.27-alpine
    container_name: nginx_frontends_v0_v1
    ports:
      - "5180:80"
    volumes:
      - ./nginx/frontends-v0-v1-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
