version: '3.8'

services:
  postgres_central:
    image: timescale/timescaledb:2.12.2-pg15
    container_name: postgres_central
    restart: unless-stopped
    environment:
      POSTGRES_DB: locker_central
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      TZ: UTC
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5435:5432"
    volumes:
      - ../03_data/postgres_central:/var/lib/postgresql/data
      - ./postgres_central/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - locker-network

networks:
  locker-network:
    external: true
