# 02_docker/postgres_central/postgresql.conf

# PostgreSQL Configuration File for Locker System
# Generated for PostGIS 15-3.4

# Connection Settings
listen_addresses = '*'
port = 5432
max_connections = 100

# Memory Settings
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 4MB
maintenance_work_mem = 64MB

# Write Ahead Log
wal_level = replica
max_wal_senders = 10
wal_keep_size = 512MB

# Query Tuning
effective_io_concurrency = 200
random_page_cost = 1.1

# Monitoring
shared_preload_libraries = 'timescaledb,pg_cron'
# pg_cron.database_name = 'locker_central'
cron.database_name = 'locker_central'

# Logging
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_statement = 'ddl'
log_min_duration_statement = 1000

# Timezone
timezone = 'UTC'

# Extensions
timescaledb.telemetry_level = 'off'
